name: Dependabot Build and Release

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write # Required to create releases and push tags

jobs:
  build-and-release:
    # Crucial security check: Only run this job if the PR was opened by Dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code from the Dependabot branch
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # 2. Set up your language environment (Example: Node.js)
      # Change this block depending on how chilledwindows is built
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-base: '20'
          cache: 'npm'

      # 3. Install dependencies and build the program
      - name: Install & Build
        run: |
          npm ci
          npm run build

      # 4. Generate a unique tag version using the current timestamp/run ID
      - name: Generate Release Tag
        id: tag
        run: echo "version=v1.0.dependabot-${{ github.run_id }}" >> $GITHUB_OUTPUT

      # 5. Create the GitHub Release and upload your built binaries/artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Dependabot Auto-Build: ${{ steps.tag.outputs.version }}"
          body: |
            Automated build generated from Dependabot updates.
            Review the changes in PR #${{ github.event.pull_request.number }}.
          draft: false
          prerelease: true # Keeps it marked as a pre-release so it doesn't mess with production versions
          # files: |
          #   dist/chilledwindows.exe   # <-- Uncomment and point this to your actual compiled program/zip file
